name: Vacancy Check

on:
  workflow_dispatch: # 手動（外部API経由）で動かせるようにする

jobs:
    run-checker:
      runs-on: ubuntu-latest
      timeout-minutes: 10 # 万が一のハングアップを防ぐため、最大10分で強制終了
      permissions:
        contents: write # Gitのコミットとプッシュを行うために必要
        actions:  write # ワークフローのステータス参照や自身をキャンセルするために必要
      steps:
        - name: Guard against concurrent runs (Keep older, cancel newer)
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            # 自分以外の同じワークフローで、現在「実行中(in_progress)」のランナーが存在するか確認する
            CURRENT_RUN_ID="${{ github.run_id }}"
            WORKFLOW_FILE="check.yml"
            
            # 実行中の他のRUN IDを取得（自分自身は除外）
            OTHER_RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs?status=in_progress \
              --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID) | .id" 2>/dev/null || echo "")
            
            if [ -n "$OTHER_RUNS" ]; then
              echo "⚠️ Another run is already in progress. Canceling this new run ($CURRENT_RUN_ID) to protect the active one..."
              gh api -X POST repos/${{ github.repository }}/actions/runs/$CURRENT_RUN_ID/cancel
              exit 0
            else
              echo "✅ No other runs in progress. Proceeding with this run."
            fi

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Cache pip and Playwright browsers
          uses: actions/cache@v4
          with:
            path: |
              ~/.cache/pip
              ~/.cache/ms-playwright
            key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
            restore-keys: |
              ${{ runner.os }}-playwright-

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            pip install playwright
            
            # キャッシュが効いている（フォルダが存在する）場合は重いフルインストールをスキップする
            if [ ! -d "$HOME/.cache/ms-playwright" ]; then
              echo "Playwright cache not found. Running full install with deps..."
              playwright install --with-deps chromium
            else
              echo "Playwright browsers already cached. Skipping full install."
            fi

        - name: Run reservation checker
          env:
            PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
            PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
            PUSHOVER_URL: ${{ secrets.PUSHOVER_URL }}
          run: |
            python main.py

        - name: Commit and push state changes
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # 予期せぬ未追跡ファイルや変更による rebase 失敗を防ぐためクリーンアップ
            git checkout .
            git clean -fd
            
            # まずリモートの最新変更を安全に取り込む（競合を防ぐ）
            git pull --rebase origin main || true
            
            # state.json と index.html は .gitignore を無視して強制追加する
            git add -f state.json
            git add -f index.html
            
            # Pythonを使って config.json から save_debug_html の値 (True/False) を取得する
            SAVE_HTML=$(python3 -c "import json; print(json.load(open('config.json', 'r', encoding='utf-8')).get('save_debug_html', False))")
            
            if [ "$SAVE_HTML" = "True" ]; then
              echo "save_debug_html is true. Including debug HTML files in commit."
              git add debug_html/*_week*.html 2>/dev/null || true
              COMMIT_MSG="Update state, index.html, and debug html"
            else
              echo "save_debug_html is false. Cleaning up any debug HTML files."
              git checkout -- debug_html/*_week*.html 2>/dev/null || true
              rm -rf debug_html 2>/dev/null || true
              COMMIT_MSG="Update state.json and index.html"
            fi
            
            # 変更がある場合のみコミットして、--force-with-lease で安全にプッシュする
            git diff --quiet && git diff --staged --quiet || (
              git commit -m "$COMMIT_MSG"
              git push --force-with-lease origin main
            )