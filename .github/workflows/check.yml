name: Vacancy Check

on:
  workflow_dispatch: # 手動（外部API経由）で動かせるようにする

jobs:
    run-checker:
      runs-on: ubuntu-latest
      permissions:
        contents: write # Gitのコミットとプッシュを行うために必要
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            # 確実にplaywrightパッケージをインストールする
            pip install playwright
            # その後にブラウザをインストールする
            playwright install --with-deps chromium

        - name: Run reservation checker
          env:
            # Pythonが読み込めるように、GitHubのSecretsを目的の変数名に割り当てる
            PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
            PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
            PUSHOVER_URL: ${{ secrets.PUSHOVER_URL }}
          run: |
            python main.py

        - name: Commit and push state changes
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # .gitignore に latest-result.html が確実に含まれているか確認・保証する
            if ! grep -q "latest-result.html" .gitignore; then
              echo "latest-result.html" >> .gitignore
            fi
            
            # state.jsonと最新結果のテキストをコミット対象にする
            git add state.json latest-result.txt
            
            # .gitignore に入っていても latest-result.html は強制的にコミット・公開対象に含める
            git add -f latest-result.html
            
            # Pythonを使って config.json から save_debug_html の値 (True/False) を取得する
            SAVE_HTML=$(python3 -c "import json; print(json.load(open('config.json', 'r', encoding='utf-8')).get('save_debug_html', False))")
            
            if [ "$SAVE_HTML" = "True" ]; then
              echo "save_debug_html is true. Including debug HTML files in commit."
              # debug_html フォルダ内のタイムスタンプ付きHTMLファイルをステージングに追加
              git add debug_html/*_week*.html 2>/dev/null || true
              COMMIT_MSG="Update state, result files, and debug html [skip ci]"
            else
              echo "save_debug_html is false. Cleaning up any debug HTML files."
              git checkout -- debug_html/*_week*.html 2>/dev/null || true
              rm -rf debug_html 2>/dev/null || true
              COMMIT_MSG="Update state.json, latest-result.txt, and latest-result.html [skip ci]"
            fi
            
            # 変更がある場合のみコミットしてプッシュする
            git diff --quiet && git diff --staged --quiet || (git commit -m "$COMMIT_MSG" && git push)