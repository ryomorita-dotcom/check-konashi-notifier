name: Vacancy Check

on:
  workflow_dispatch: # 手動（外部API経由）で動かせるようにする

jobs:
    run-checker:
      runs-on: ubuntu-latest
      timeout-minutes: 10 # 💡 万が一のハングアップを防ぐため、最大10分で強制終了
      permissions:
        contents: write # Gitのコミットとプッシュを行うために必要
      steps:
        - name: Guard against concurrent runs (Keep older, cancel newer)
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            # 自分以外の同じワークフローで、現在「実行中(in_progress)」のランナーが存在するか確認する
            CURRENT_RUN_ID="${{ github.run_id }}"
            WORKFLOW_FILE="check.yml"
            
            # 実行中の他のRUN IDを取得（自分自身は除外）
            OTHER_RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs?status=in_progress \
              --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID) | .id" 2>/dev/null || echo "")
            
            if [ -n "$OTHER_RUNS" ]; then
              echo "⚠️ Another run is already in progress. Canceling this new run ($CURRENT_RUN_ID) to protect the active one..."
              gh api -X POST repos/${{ github.repository }}/actions/runs/$CURRENT_RUN_ID/cancel
              exit 0
            else
              echo "✅ No other runs in progress. Proceeding with this run."
            fi

        - name: Checkout repository
          uses: actions/checkout@v4[cite: 1]

        - name: Set up Python
          uses: actions/setup-python@v5[cite: 1]
          with:
            python-version: '3.10'[cite: 1]

        - name: Cache pip and Playwright browsers
          uses: actions/cache@v4[cite: 1]
          with:
            path: |[cite: 1]
              ~/.cache/pip[cite: 1]
              ~/.cache/ms-playwright[cite: 1]
            key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}[cite: 1]
            restore-keys: |[cite: 1]
              ${{ runner.os }}-playwright-[cite: 1]

        - name: Install dependencies
          run: |[cite: 1]
            python -m pip install --upgrade pip[cite: 1]
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi[cite: 1]
            pip install playwright[cite: 1]
            
            # キャッシュが効いている（フォルダが存在する）場合は重いフルインストールをスキップする[cite: 1]
            # ※注意: チルダ(~)展開を確実に効かせるため $HOME を使う[cite: 1]
            if [ ! -d "$HOME/.cache/ms-playwright" ]; then[cite: 1]
              echo "Playwright cache not found. Running full install with deps..."[cite: 1]
              playwright install --with-deps chromium[cite: 1]
            else[cite: 1]
              echo "Playwright browsers already cached. Skipping full install."[cite: 1]
            fi

        - name: Run reservation checker
          env:[cite: 1]
            PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}[cite: 1]
            PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}[cite: 1]
            PUSHOVER_URL: ${{ secrets.PUSHOVER_URL }}[cite: 1]
          run: |[cite: 1]
            python main.py[cite: 1]

        - name: Commit and push state changes
          run: |[cite: 1]
            git config --global user.name "github-actions[bot]"[cite: 1]
            git config --global user.email "github-actions[bot]@users.noreply.github.com"[cite: 1]
            
            # まずリモートの最新変更を安全に取り込む（競合を防ぐ）[cite: 1]
            git pull --rebase origin main || true[cite: 1]
            
            # state.json を通常追加し、index.html は .gitignore を無視して強制追加する[cite: 1]
            git add state.json[cite: 1]
            git add -f index.html[cite: 1]
            
            # Pythonを使って config.json から save_debug_html の値 (True/False) を取得する[cite: 1]
            SAVE_HTML=$(python3 -c "import json; print(json.load(open('config.json', 'r', encoding='utf-8')).get('save_debug_html', False))")[cite: 1]
            
            if [ "$SAVE_HTML" = "True" ]; then[cite: 1]
              echo "save_debug_html is true. Including debug HTML files in commit."[cite: 1]
              git add debug_html/*_week*.html 2>/dev/null || true[cite: 1]
              COMMIT_MSG="Update state, index.html, and debug html"[cite: 1]
            else[cite: 1]
              echo "save_debug_html is false. Cleaning up any debug HTML files."[cite: 1]
              git checkout -- debug_html/*_week*.html 2>/dev/null || true[cite: 1]
              rm -rf debug_html 2>/dev/null || true[cite: 1]
              COMMIT_MSG="Update state.json and index.html"[cite: 1]
            fi[cite: 1]
            
            # 変更がある場合のみコミットして、--force-with-lease で安全にプッシュする[cite: 1]
            git diff --quiet && git diff --staged --quiet || ([cite: 1]
              git commit -m "$COMMIT_MSG"[cite: 1]
              git push --force-with-lease origin main[cite: 1]
            )