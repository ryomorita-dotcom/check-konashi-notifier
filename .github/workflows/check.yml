name: Vacancy Check

on:
  schedule:
    # 5分おきに実行するCron設定
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動でも動かせるようにする

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gitのコミットとプッシュを行うために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 確実にplaywrightパッケージをインストールする
          pip install playwright
          # その後にブラウザをインストールする
          playwright install --with-deps chromium

      - name: Run reservation checker
        env:
          # Pythonが読み込めるように、GitHubのSecretsを目的の変数名に割り当てる
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          python main.py

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # 変更がある場合のみコミットしてプッシュする
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json [skip ci]" && git push)